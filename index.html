<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WASSYOI</title>
<!-- 旧 URL（wassyoi-fes.github.io/about/）は wassyoi-fes.com に移転した。
     GitHub Pages はサーバー側の 301 ができないため、Google が恒久的な転送として扱う
     「待ち時間 0 の meta refresh」と canonical で移転先を伝える -->
<link rel="canonical" href="https://wassyoi-fes.com/">
<meta http-equiv="refresh" content="0; url=https://wassyoi-fes.com/">
<script>location.replace('https://wassyoi-fes.com' + location.pathname.replace(/^\/about/, '') + location.search + location.hash);</script>
</head>
<body>
<p><a href="https://wassyoi-fes.com/">wassyoi-fes.com</a> に移動しました。</p>
</body>
</html>
